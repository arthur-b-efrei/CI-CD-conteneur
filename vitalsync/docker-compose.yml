services:

  # ── Base de données PostgreSQL ──────────────────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: vitalsync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Volume nommé persistant : les données survivent à docker-compose down
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vitalsync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Node.js / Express ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitalsync-backend
    restart: unless-stopped
    environment:
      NODE_ENV:          ${NODE_ENV}
      PORT:              ${PORT}
      DB_HOST:           database
      DB_PORT:           5432
      DB_NAME:           ${POSTGRES_DB}
      DB_USER:           ${POSTGRES_USER}
      DB_PASSWORD:       ${POSTGRES_PASSWORD}
    ports:
      - "${PORT}:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - vitalsync-network

  # ── Frontend Nginx ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vitalsync-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vitalsync-network

# ── Réseau bridge personnalisé ─────────────────────────────────────────────────
# Un réseau bridge dédié isole les conteneurs du reste de Docker :
# - Seuls les services déclarés ici peuvent communiquer entre eux
# - Les conteneurs se joignent par nom (ex: "backend", "database") sans exposer leurs ports
# - Le réseau bridge par défaut ne supporte pas la résolution DNS par nom de service
networks:
  vitalsync-network:
    driver: bridge

# ── Volume persistant PostgreSQL ───────────────────────────────────────────────
# Sans ce volume, toutes les données seraient perdues à chaque docker-compose down.
# Avec ce volume nommé, Docker conserve les données sur l'hôte indépendamment
# du cycle de vie des conteneurs.
volumes:
  postgres_data:
