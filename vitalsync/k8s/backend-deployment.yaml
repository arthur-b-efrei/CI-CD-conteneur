apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalsync-backend
  labels:
    app: vitalsync-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vitalsync-backend
  template:
    metadata:
      labels:
        app: vitalsync-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/arthur-b-efrei/vitalsync-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "vitalsync-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "vitalsync"
            - name: DB_USER
              value: "vitalsync_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vitalsync-secret
                  key: postgres-password
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
