<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitalSync</title>
    <style>
      body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
      h1 { color: #2563eb; }
      #status { padding: 0.5rem 1rem; background: #f0fdf4; border-left: 4px solid #16a34a; }
    </style>
  </head>
  <body>
    <h1>VitalSync - Suivi médical et sportif</h1>
    <p id="status">Chargement...</p>
    <script>
      fetch("/api/health")
        .then(r => r.json())
        .then(d => {
          document.getElementById("status").textContent = "API: " + d.status;
        });
    </script>
  </body>
</html>
