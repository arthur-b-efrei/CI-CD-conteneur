name: CI/CD VitalSync

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/vitalsync-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/vitalsync-frontend

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 1 : Lint & Tests
  # ────────────────────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vitalsync/backend/package.json

      - name: Installation des dépendances
        run: npm install
        working-directory: vitalsync/backend

      - name: Lint ESLint
        run: npm run lint
        working-directory: vitalsync/backend

      - name: Tests unitaires Jest
        run: npm test
        working-directory: vitalsync/backend

  # ────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 2 : Build & Push Docker
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au registry GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push image backend
        uses: docker/build-push-action@v5
        with:
          context: vitalsync/backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: Build et push image frontend
        uses: docker/build-push-action@v5
        with:
          context: vitalsync/frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest

  # ────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 3 : Déploiement staging + Health check
  # ────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Création du fichier .env de staging
        run: |
          cat <<EOF > vitalsync/.env
          POSTGRES_DB=vitalsync
          POSTGRES_USER=vitalsync_user
          POSTGRES_PASSWORD=vitalsync_pass_staging
          NODE_ENV=production
          PORT=3000
          EOF

      - name: Démarrage des services via docker-compose
        run: docker compose up -d --build
        working-directory: vitalsync

      - name: Attente du démarrage des services (15s)
        run: sleep 15

      - name: Health check du backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check échoué — statut HTTP: $STATUS"
            docker compose logs backend
            exit 1
          fi
          echo "Health check réussi"
        working-directory: vitalsync

      - name: Arrêt des services
        if: always()
        run: docker compose down -v
        working-directory: vitalsync
